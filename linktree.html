<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eatlah Linktree</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #a9a9a9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* CARD */
        .card {
            width: 360px;
            background: #f5f5f5;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* TOP ICONS */
        .top-left {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
        }

        .top-right {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 18px;
        }

        /* PROFILE */
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 40px auto 10px;
            object-fit: cover;
        }

        .username {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* BUTTON */
        .link {
            background: #45d35c;
            color: black;
            padding: 14px;
            border-radius: 10px;
            margin: 12px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            text-decoration: none;
            font-weight: 500;
        }

        .link:hover {
            opacity: 0.9;
        }

        .dots {
            position: absolute;
            right: 15px;
            font-weight: bold;
        }

        /* FOOTER */
        .footer {
            font-size: 11px;
            color: #666;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="card">


        <!-- PROFILE -->
        <img src="assets/img/logoeatlah.jpg" class="avatar" alt="Eatlah Logo">
        <div class="username">@eatlahjkt</div>

        <!-- LINKS -->
        <a href="https://www.instagram.com/eatlahjkt/" class="link" target="_blank">
            Instagram
        </a>

        <a href="https://www.tiktok.com/@eatlahjkt?_t=8VQxeQaNgu1&_r=1" class="link" target="_blank">
            Tiktok
        </a>

        <a href="https://api.whatsapp.com/send?phone=6282111078742" class="link" target="_blank">
            Customer Relations
        </a>

        <!-- FOOTER -->
        <div class="footer">
            Cookie Preferences • Report • Privacy • More from Linktree
        </div>

    </div>

</body>

</html>
